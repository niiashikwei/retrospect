name: Collect and publish dashboard

on:
  schedule:
    - cron: '17 * * * *' # hourly
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Never pull_request_target: agent workflows must not run with secrets on fork PRs.
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data:data
            git worktree add data data
          else
            git worktree add --orphan -b data data
          fi
      - name: Requirements matrix for the dashboard
        run: npm test > /dev/null && npm run trace || echo "trace reported problems; shown on the dashboard"
      - name: Collect CI signals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run collect -- data
      - name: Build dashboard.json
        run: |
          if [ -s data/signals/jobs.jsonl ]; then npm run report -- data; else npm run sample -- data; fi
      - name: Commit data
        working-directory: data
        run: |
          git add -A
          git -c user.name="retrospect-bot" -c user.email="retrospect-bot@users.noreply.github.com" commit -m "data: collect $(date -u +%FT%TZ)" || exit 0
          git push origin data
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dashboard/index.html _site/
          cp data/dashboard.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
